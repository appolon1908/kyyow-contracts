name: validate-platform-component
on:
  workflow_call:
    inputs:
      profile:
        description: Repository-relative Kyyow component profile
        required: false
        default: kyyow-integration.v1.json
        type: string
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate fail-closed component contract
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = Path(os.environ['PROFILE'])
          if p.is_absolute() or '..' in p.parts:
              raise SystemExit('unsafe profile path')
          d = json.loads(p.read_text())
          required = {'schema','repository','component','authority','exposure','native_ports','inputs','outputs','controls','identity','secrets','operations','activation'}
          if set(d) != required or d['schema'] != 'kyyow.platform-component.v1':
              raise SystemExit('invalid component shape')
          if not re.fullmatch(r'appolon1908-hue/[A-Za-z0-9._-]+', d['repository']):
              raise SystemExit('invalid repository authority')
          if d['exposure'] not in {'private','private-admin','authenticated-ui'}:
              raise SystemExit('unsafe exposure')
          if d['identity'] != {'authority':'appolon1908-hue/Keycloak','workload_identity_required':True,'anonymous_admin_access':False}:
              raise SystemExit('identity boundary drift')
          if d['secrets'] != {'authority':'appolon1908-hue/Codestra-OpenBao','secrets_in_git':False,'environment_plaintext_secrets':False}:
              raise SystemExit('secrets boundary drift')
          if d['operations'] != {'middleware_is_sole_odoo_writer':True,'grafana_read_only':True,'superset_read_only':True}:
              raise SystemExit('operational authority drift')
          if d['activation'] != {'source_contract_complete':True,'runtime_evidence_complete':False,'production_activation_authorized':False}:
              raise SystemExit('activation must remain fail closed')
          if not d['controls'] or len(d['native_ports']) != len(set(d['native_ports'])):
              raise SystemExit('controls or ports invalid')
          print('KYYOW_PLATFORM_COMPONENT=PASS component=' + d['component'])
          PY
