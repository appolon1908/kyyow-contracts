name: contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: npm ci
      - run: npm run check
      - run: npm run format-check
      - run: npm --prefix typescript run pack:check
      - name: Build all NuGet contract projects
        run: find src -name '*.csproj' -print0 | sort -z | xargs -0 -n1 dotnet build --configuration Release
